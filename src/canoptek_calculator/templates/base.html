<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ settings.app_name }}</title>
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <div class="app-shell">
      {% block content %}{% endblock %}
    </div>
    <div id="error-popup" class="error-popup" role="alertdialog" aria-modal="true" aria-labelledby="error-popup-title" aria-describedby="error-popup-message" hidden>
      <div class="error-popup-backdrop" data-error-close></div>
      <div class="error-popup-panel">
        <button id="error-popup-close" class="error-popup-close" type="button" aria-label="Close error message">&times;</button>
        <p class="error-popup-label">Action needed</p>
        <h2 id="error-popup-title">Something went wrong</h2>
        <p id="error-popup-message" class="error-popup-message">An unexpected error occurred.</p>
        <details id="error-popup-details" class="error-popup-details" hidden>
          <summary>Technical details</summary>
          <pre id="error-popup-detail-text"></pre>
        </details>
        <div class="error-popup-actions">
          <button id="error-popup-dismiss" class="button button-secondary" type="button">Dismiss</button>
          <button id="error-popup-retry" class="button button-primary" type="button" hidden>Try again</button>
        </div>
      </div>
    </div>
    <script src="/static/js/app.js" defer></script>
  </body>
</html>
